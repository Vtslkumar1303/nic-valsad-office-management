<!doctype html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    html,body{margin:0;height:100%;font:14px Arial,sans-serif;background:#f4f7fa;color:#18324a}
    #status{padding:12px 16px;background:#fff;border-bottom:1px solid #dce4eb}
    #status strong{display:block;margin-bottom:4px}
    #app{width:100%;height:calc(100% - 52px);border:0;display:none}
    #error{padding:24px;max-width:680px;line-height:1.55}
  </style>
</head>
<body>
  <div id="status"><strong>NIC Valsad Office Management</strong><span id="message">Verifying your Google account…</span></div>
  <div id="error" hidden></div>
  <iframe id="app" title="NIC Valsad Office Management" allow="clipboard-read; clipboard-write"></iframe>
  <script>
    const APP_ORIGIN = "https://vtslkumar1303.github.io";
    const APP_URL = "https://vtslkumar1303.github.io/nic-valsad-office-management/";
    const frame = document.getElementById("app");
    const message = document.getElementById("message");
    const errorBox = document.getElementById("error");
    function showError(err) {
      message.textContent = "Access could not be verified.";
      errorBox.hidden = false;
      errorBox.textContent = (err && err.message ? err.message : String(err)) +
        " If you believe you should have access, ask the spreadsheet owner to confirm that your Google account has Editor permission.";
    }
    google.script.run.withSuccessHandler(user => {
      message.textContent = "Signed in as " + user.email + " · Access verified";
      frame.src = APP_URL;
      frame.style.display = "block";
    }).withFailureHandler(showError).getCurrentUser();

    window.addEventListener("message", event => {
      if (event.origin !== APP_ORIGIN || event.source !== frame.contentWindow) return;
      const msg = event.data || {};
      if (msg.channel !== "nic-valsad-office" || !msg.requestId || typeof msg.method !== "string") return;
      const allowed = {
        getWorkbookData: [],
        loadModuleData: [msg.moduleName],
        saveModuleData: [msg.moduleName, msg.records, msg.expectedRevision]
      };
      if (!Object.prototype.hasOwnProperty.call(allowed, msg.method)) return;
      const runner = google.script.run
        .withSuccessHandler(result => frame.contentWindow.postMessage({
          channel:"nic-valsad-office", requestId:msg.requestId, ok:true, result
        }, APP_ORIGIN))
        .withFailureHandler(err => frame.contentWindow.postMessage({
          channel:"nic-valsad-office", requestId:msg.requestId, ok:false,
          error:err && err.message ? err.message : String(err)
        }, APP_ORIGIN));
      runner[msg.method](...allowed[msg.method]);
    });
  </script>
</body>
</html>
